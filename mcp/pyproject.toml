[project]
name = "isaac-agent-mcp"
version = "0.1.0"
description = "MCP stdio adapter for the isaac-agent protocol (drive a running Isaac Sim)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.28", "websockets>=14"]

[project.scripts]
isaac-agent-mcp = "isaac_agent_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isaac_agent_mcp"]
